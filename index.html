<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles/styles.css">
    <script src="Scripts/login.js"></script>
</head>
<body class="bg-gradient-to-br from-[#e8d5c4] to-[#d4bfa8] min-h-screen p-5 flex items-center justify-center">
    <div class="max-w-md w-full">
        <h1 class="text-4xl font-semibold text-center text-gray-800 mb-12 tracking-tight">Welcome back</h1>
        
        <div id="loginBox" class="bg-[#f5f5f0] rounded-3xl p-12 shadow-xl">
            <h2 class="text-3xl font-medium text-center text-gray-800 mb-10">Login</h2>
            
            <form id="loginForm">
                <div class="mb-6">
                    <div class="relative flex items-center">
                        <span class="absolute left-5 text-[#8b7355] text-xl pointer-events-none">👤</span>
                        <input 
                            type="email" 
                            id="loginEmail" 
                            placeholder="Email address" 
                            required
                            class="w-full py-4 pl-14 pr-4 border-2 border-gray-800 
                            rounded-full text-base bg-[#f5f5f0] transition-all duration-300 
                            outline-none focus:border-[#8b7355] focus:ring-4 focus:ring-[#8b7355]/10"
                        >
                    </div>
                </div>

                <div class="mb-6">
                    <div class="relative flex items-center">
                        <span class="absolute left-5 text-[#8b7355] text-xl pointer-events-none">🔒</span>
                        <input 
                            type="password" 
                            id="loginPassword" 
                            placeholder="Password" 
                            required
                            class="w-full py-4 pl-14 pr-14 border-2 border-gray-800 rounded-full 
                            text-base bg-[#f5f5f0] transition-all duration-300 outline-none 
                            focus:border-[#8b7355] focus:ring-4 focus:ring-[#8b7355]/10"
                        >
                        <span 
                            onclick="seePassword()" 
                            class="absolute right-5 cursor-pointer text-[#8b7355] text-xl transition-colors hover:text-[#6d5a44]"
                        >👁️</span>
                    </div>
                    <div class="text-right mt-2">
                        <a href="#" class="text-[#8b7355] text-sm transition-colors hover:text-[#6d5a44] hover:underline">Forgot password?</a>
                    </div>
                </div>

                <div class="flex items-center mb-6 text-sm text-gray-600">
                    <input type="checkbox" id="remember" class="mr-2 cursor-pointer">
                    <label for="remember" class="cursor-pointer">Remember me</label>
                </div>

                <div id="errorMessage" class="hidden text-red-600 text-sm text-center mt-2 mb-4">
                    Email o contraseña incorrectos
                </div>
                
                <button 
                    type="submit" 
                    class="w-full py-4 bg-[#8b7355] text-white rounded-full text-lg font-medium 
                    cursor-pointer transition-all duration-300 mt-4 hover:bg-[#6d5a44] hover:-translate-y-0.5 
                    hover:shadow-lg hover:shadow-[#8b7355]/30 active:translate-y-0"
                >
                    Login
                </button>
            </form>

            <div class="mt-6 text-center text-sm text-gray-600">
                Don't have an account? <a href="#" class="text-[#8b7355] font-semibold hover:underline">Sign up</a>
            </div>
        </div>
    </div>
</body>
</html>
